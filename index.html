<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vampire Survivors Web - 뱀서 웹 서바이벌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 인게임 상단 HUD -->
    <div id="hudOverlay">
      <div class="hud-top-bar">
        <div class="hud-stat-box" id="stageBadge">STAGE 1 / 10</div>
        <div class="hud-stat-box" id="timerBadge">⏱️ 01:00</div>
        <div class="hud-stat-box" id="killBadge">💀 0</div>
        <div class="hud-stat-box" id="levelBadge">Lv. 1</div>
        <button id="pauseToggleBtn" class="hud-btn" title="일시정지 (ESC / P)">⏸️</button>
        <button id="soundToggleBtn" class="hud-btn" title="소리 켜기/끄기">🔊</button>
      </div>

      <!-- 경험치 바 -->
      <div class="exp-bar-container">
        <div id="expBarFill" class="exp-bar-fill"></div>
        <span id="expText" class="exp-text">EXP 0%</span>
      </div>

      <!-- 좌측 상단 플레이어 체력 및 인벤토리 -->
      <div class="hud-player-status">
        <div class="hp-bar-container">
          <div id="hpBarFill" class="hp-bar-fill"></div>
          <span id="hpText" class="hp-text">100 / 100</span>
        </div>
        <div class="inventory-slots" id="weaponSlots">
          <!-- 활성 무기 아이콘 목록 -->
        </div>
        <div class="inventory-slots" id="passiveSlots">
          <!-- 보유 패시브 카드 아이콘 목록 -->
        </div>
      </div>
    </div>

    <!-- 보스 경보 배너 -->
    <div id="bossAlert" class="boss-alert hidden">
      <div class="boss-alert-content">
        <span class="boss-alert-icon">⚠️</span>
        <span class="boss-alert-text" id="bossAlertText">보스 출현 경보!</span>
        <span class="boss-alert-icon">⚠️</span>
      </div>
    </div>

    <!-- 스테이지 클리어 안내 배너 -->
    <div id="stageClearBanner" class="stage-banner hidden">
      <h2 id="stageBannerTitle">STAGE 1 CLEAR!</h2>
      <p id="stageBannerSub">다음 웨이브가 시작됩니다...</p>
    </div>

    <!-- 레벨업 카드 선택 모달 -->
    <div id="cardModal" class="modal-backdrop hidden">
      <div class="modal-box card-selection-box">
        <h2 class="modal-title">⭐ LEVEL UP! ⭐</h2>
        <p class="modal-sub">강화 카드를 1장 선택하세요</p>
        <div class="cards-container" id="cardsList">
          <!-- JS에서 3장의 카드가 동적으로 생성됩니다 -->
        </div>
      </div>
    </div>

    <!-- 게임 오버 모달 -->
    <div id="gameOverModal" class="modal-backdrop hidden">
      <div class="modal-box result-box game-over">
        <h1 class="result-title text-danger">☠️ YOU DIED ☠️</h1>
        <p class="result-sub">어둠에 삼켜졌습니다...</p>
        <div class="result-stats" id="gameOverStats">
          <!-- 최종 기록 -->
        </div>
        <button id="restartBtn" class="action-btn">다시 도전하기</button>
      </div>
    </div>

    <!-- 승리 모달 -->
    <div id="victoryModal" class="modal-backdrop hidden">
      <div class="modal-box result-box game-victory">
        <h1 class="result-title text-gold">🏆 VICTORY! 🏆</h1>
        <p class="result-sub">모든 웨이브와 파멸의 군주를 물리쳤습니다!</p>
        <div class="result-stats" id="victoryStats">
          <!-- 최종 기록 -->
        </div>
        <button id="victoryRestartBtn" class="action-btn">새로운 원정 시작</button>
      </div>
    </div>

    <!-- 일시정지 모달 -->
    <div id="pauseModal" class="modal-backdrop hidden">
      <div class="modal-box result-box">
        <h1 class="result-title">⏸️ GAME PAUSED ⏸️</h1>
        <p class="result-sub">게임이 일시 정지되었습니다.</p>
        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
          <button id="resumeBtn" class="action-btn" style="background: #2563eb;">계속하기</button>
          <button id="pauseRestartBtn" class="action-btn" style="background: #dc2626;">게임 재시작</button>
        </div>
      </div>
    </div>

    <!-- 모바일 가상 조이스틱 -->
    <div id="joystickZone" class="joystick-zone">
      <div id="joystickBase" class="joystick-base">
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/waveManager.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
